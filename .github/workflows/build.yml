name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: add these repository secrets to sign releases with your own key.
      KEYSTORE_BASE64: ${{ secrets.LITETUBE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LITETUBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LITETUBE_KEYSTORE_PASSWORD: ${{ secrets.LITETUBE_KEYSTORE_PASSWORD }}
          LITETUBE_KEY_ALIAS: ${{ secrets.LITETUBE_KEY_ALIAS }}
          LITETUBE_KEY_PASSWORD: ${{ secrets.LITETUBE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: litetube-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
