name: Build InstaChat APK

on:
  push:
    paths:
      - "instachat/**"
      - ".github/workflows/instachat.yml"
  pull_request:
    paths:
      - "instachat/**"
      - ".github/workflows/instachat.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instachat
    env:
      # Optional: add these repository secrets to sign with your own key, so new versions
      # install over old ones. Without them each build is signed with a fresh debug key.
      KEYSTORE_BASE64: ${{ secrets.INSTACHAT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "INSTACHAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          INSTACHAT_KEYSTORE_PASSWORD: ${{ secrets.INSTACHAT_KEYSTORE_PASSWORD }}
          INSTACHAT_KEY_ALIAS: ${{ secrets.INSTACHAT_KEY_ALIAS }}
          INSTACHAT_KEY_PASSWORD: ${{ secrets.INSTACHAT_KEY_PASSWORD }}
          INSTACHAT_SIGN_WITH_DEBUG_KEY: "1"
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: cp build.log .. && cd .. && python3 .github/report-build-errors.py

      - uses: actions/upload-artifact@v4
        with:
          name: instachat-apk
          path: instachat/app/build/outputs/apk/release/*.apk
