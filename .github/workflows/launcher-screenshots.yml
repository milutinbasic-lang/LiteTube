name: LiteLauncher screenshots (emulator)

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/launcher-screenshots.sh"
      - ".github/workflows/launcher-screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          LITETUBE_SIGN_WITH_DEBUG_KEY: "1"
        run: ./gradlew --no-daemon -p launcher assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash .github/launcher-screenshots.sh

      - name: Store screenshots on the ci-launcher-screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-launcher-screenshots
          git rm -rf --cached . > /dev/null
          git add -f shots/*.png shots/*.txt shots/*.xml
          git commit -m "LiteLauncher screenshots"
          git push -f origin ci-launcher-screenshots
