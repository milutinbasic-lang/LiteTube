name: Build LiteLauncher

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          LITETUBE_SIGN_WITH_DEBUG_KEY: "1"
        run: ./gradlew --no-daemon -p launcher assembleRelease

      - name: APK size
        run: ls -l launcher/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: litelauncher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
